<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1050 250' width='1050' height='250' role='img' aria-label='Request flow: client, DNS, cloud load balancer, Ingress Controller, Service, Pods' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Request flow: client, DNS, cloud load balancer, Ingress Controller, Service, Pods</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='330' y='20' width='705' height='180' rx='8' fill='#F7F7FD' stroke='#4B4BA0' stroke-dasharray='6 4'/><text x='340' y='38' font-size='11.5' text-anchor='start' fill='#4B4BA0' font-weight='600' >Kubernetes cluster</text><rect x='20' y='100' width='110' height='46' rx='3' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='75.0' y='120.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Client</text><text x='75.0' y='136.0' text-anchor='middle' font-size='10.5' fill='#444'>example.com/api</text><rect x='175' y='100' width='110' height='46' rx='3' fill='#FFE7B3' stroke='#B7862B' stroke-width='1.3'/><text x='230.0' y='120.0' text-anchor='middle' font-size='13'  fill='#111'>DNS</text><text x='230.0' y='136.0' text-anchor='middle' font-size='10.5' fill='#444'>name → LB IP</text><rect x='350' y='100' width='120' height='46' rx='3' fill='#FFE7B3' stroke='#B7862B' stroke-width='1.3'/><text x='410.0' y='120.0' text-anchor='middle' font-size='13'  fill='#111'>Load Balancer</text><text x='410.0' y='136.0' text-anchor='middle' font-size='10.5' fill='#444'>one public IP</text><rect x='515' y='100' width='140' height='46' rx='3' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='585.0' y='120.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Ingress Controller</text><text x='585.0' y='136.0' text-anchor='middle' font-size='10.5' fill='#444'>match host + path</text><rect x='700' y='100' width='95' height='46' rx='3' fill='#FFFFFF' stroke='#333333' stroke-width='1.3'/><text x='747.5' y='120.0' text-anchor='middle' font-size='13'  fill='#111'>Service</text><text x='747.5' y='136.0' text-anchor='middle' font-size='10.5' fill='#444'>api-service</text><rect x='825' y='98' width='200' height='50' fill='none' stroke='#555' stroke-dasharray='3 3'/><rect x='833' y='106' width='56' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='861.0' y='127.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><rect x='897' y='106' width='56' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='925.0' y='127.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><rect x='961' y='106' width='56' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='989.0' y='127.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><path d='M130,123 L173,123' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M285,123 L348,123' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M470,123 L513,123' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M655,123 L698,123' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M795,123 L823,123' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><circle cx='152' cy='95' r='9' fill='#4B4BA0'/><text x='152' y='99' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>1</text><circle cx='316' cy='95' r='9' fill='#4B4BA0'/><text x='316' y='99' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>2</text><circle cx='492' cy='95' r='9' fill='#4B4BA0'/><text x='492' y='99' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>3</text><circle cx='676' cy='95' r='9' fill='#4B4BA0'/><text x='676' y='99' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>4</text><circle cx='810' cy='95' r='9' fill='#4B4BA0'/><text x='810' y='99' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>5</text><text x='525' y='232' font-size='11' text-anchor='middle' fill='#444'  >1 Client calls domain  ·  2 DNS returns LB IP  ·  3 LB forwards to controller  ·  4 Rule match → Service  ·  5 Service → Pod</text></svg>