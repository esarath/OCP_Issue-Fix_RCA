<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 200' width='900' height='200' role='img' aria-label='Ingress YAML rules are watched by the Ingress Controller, which routes traffic to Services and Pods' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Ingress YAML rules are watched by the Ingress Controller, which routes traffic to Services and Pods</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='20' y='70' width='160' height='56' rx='3' fill='#EFEFEF' stroke='#777777' stroke-width='1.3'/><text x='100.0' y='95.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Ingress (YAML)</text><text x='100.0' y='111.0' text-anchor='middle' font-size='10.5' fill='#444'>the rules</text><rect x='290' y='70' width='170' height='56' rx='3' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='375.0' y='95.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Ingress Controller</text><text x='375.0' y='111.0' text-anchor='middle' font-size='10.5' fill='#444'>NGINX / Traefik / HAProxy</text><rect x='560' y='76' width='100' height='44' rx='3' fill='#FFFFFF' stroke='#333333' stroke-width='1.3'/><text x='610.0' y='102.5' text-anchor='middle' font-size='13'  fill='#111'>Service</text><rect x='690' y='69' width='182' height='50' fill='none' stroke='#555' stroke-dasharray='3 3'/><rect x='698' y='77' width='50' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='723.0' y='98.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><rect x='756' y='77' width='50' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='781.0' y='98.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><rect x='814' y='77' width='50' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='839.0' y='98.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><path d='M180,98 L288,98' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><text x='234' y='88' font-size='11.5' text-anchor='middle' fill='#555'  font-style='italic'>watched by</text><path d='M460,98 L558,98' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><text x='509' y='88' font-size='11.5' text-anchor='middle' fill='#555'  font-style='italic'>routes to</text><path d='M660,98 L688,98' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><text x='100' y='150' font-size='11' text-anchor='middle' fill='#555'  >Rulebook (does nothing alone)</text><text x='375' y='150' font-size='11' text-anchor='middle' fill='#555'  >Traffic cop (the real proxy)</text></svg>