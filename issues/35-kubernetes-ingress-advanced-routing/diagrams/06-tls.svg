<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 240' width='920' height='240' role='img' aria-label='TLS termination: HTTPS from client to Ingress, certificate from a TLS Secret, plain HTTP to Service and Pods' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>TLS termination: HTTPS from client to Ingress, certificate from a TLS Secret, plain HTTP to Service and Pods</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='250' y='20' width='655' height='205' rx='8' fill='#F7F7FD' stroke='#4B4BA0' stroke-dasharray='6 4'/><text x='260' y='38' font-size='11.5' text-anchor='start' fill='#4B4BA0' font-weight='600' >Kubernetes cluster</text><rect x='20' y='60' width='110' height='46' rx='3' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='75.0' y='80.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Client</text><text x='75.0' y='96.0' text-anchor='middle' font-size='10.5' fill='#444'>browser</text><rect x='300' y='60' width='170' height='46' rx='3' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='385.0' y='80.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Ingress Controller</text><text x='385.0' y='96.0' text-anchor='middle' font-size='10.5' fill='#444'>decrypts TLS here</text><rect x='560' y='63' width='100' height='40' rx='3' fill='#FFFFFF' stroke='#333333' stroke-width='1.3'/><text x='610.0' y='80.0' text-anchor='middle' font-size='13'  fill='#111'>Service</text><text x='610.0' y='96.0' text-anchor='middle' font-size='10.5' fill='#444'>app-service</text><rect x='690' y='58'