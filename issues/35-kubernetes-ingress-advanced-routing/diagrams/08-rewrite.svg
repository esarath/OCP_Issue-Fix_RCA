<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 130' width='900' height='130' role='img' aria-label='Rewrite target: request /api/users is rewritten so the backend receives /users' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Rewrite target: request /api/users is rewritten so the backend receives /users</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='20' y='45' width='120' height='44' rx='3' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='80.0' y='64.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Client</text><text x='80.0' y='80.0' text-anchor='middle' font-size='10.5' fill='#444'>GET /api/users</text><rect x='230' y='40' width='220' height='54' rx='3' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='340.0' y='64.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Ingress</text><text x='340.0' y='80.0' text-anchor='middle' font-size='10.5' fill='#444'>rewrite /api(/|$)(.*) → /$2</text><rect x='540' y='47' width='100' height='40' rx='3' fill='#FFFFFF' stroke='#333333' stroke-width='1.3'/><text x='590.0' y='64.0' text-anchor='middle' font-size='13'  fill='#111'>Service</text><text x='590.0' y='80.0' text-anchor='middle' font-size='10.5' fill='#444'>api-service</text><rect x='670' y='42' width='208' height='50' fill='none' stroke='#555' stroke-dasharray='3 3'/><rect x='678' y='50' width='92' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='724.0' y='71.5' text-anchor='middle' font-size='13'  fill='#111'>GET /users</text><rect x='7