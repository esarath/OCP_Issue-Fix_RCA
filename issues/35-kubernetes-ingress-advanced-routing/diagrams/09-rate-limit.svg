<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 200' width='860' height='200' role='img' aria-label='Rate limiting: Ingress lets 10 requests per second through and rejects the rest with HTTP 503' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Rate limiting: Ingress lets 10 requests per second through and rejects the rest with HTTP 503</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='20' y='50' width='120' height='44' rx='3' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='80.0' y='69.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Client</text><text x='80.0' y='85.0' text-anchor='middle' font-size='10.5' fill='#444'>50 req/s</text><rect x='250' y='45' width='170' height='54' rx='3' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='335.0' y='69.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Ingress</text><text x='335.0' y='85.0' text-anchor='middle' font-size='10.5' fill='#444'>limit-rps: &quot;10&quot;</text><rect x='530' y='52' width='100' height='40' rx='3' fill='#FFFFFF' stroke='#333333' stroke-width='1.3'/><text x='580.0' y='76.5' text-anchor='middle' font-size='13'  fill='#111'>Service</text><rect x='660' y='47' width='144' height='50' fill='none' stroke='#555' stroke-dasharray='3 3'/><rect x='668' y='55' width='60' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='698.0' y='76.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><rect x='736' y='55' width='60' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='766.0' y='76.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><path d='M140,72 L248,72' fill='none' stroke='#222' stroke-width='2.4'  marker-end='url(#ah)'/><text x='194' y='62' font-size='11.5' text-anchor='middle' fill='#444'  >all traffic</text><path d='M420,72 L528,72' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><text x='474' y='62' font-size='11.5' text-anchor='middle' fill='#1E7B34' font-weight='600' >≤ 10 req/s ✔</text><path d='M630,72 L658,72' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M335,99 L335,150 L80,150 L80,96' fill='none' stroke='#C0392B' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ahr)'/><rect x='125' y='132' width='180' height='36' rx='3' fill='#FFD6D6' stroke='#C0392B' stroke-width='1.3'/><text x='215.0' y='154.5' text-anchor='middle' font-size='13'  fill='#111'>503 Too Many Requests</text></svg>