# =============================================================================
# VirtualServer (L7) + TransportServer (L4) — F5 CIS next-gen CRDs
# CIS watches these and programs VIP/pool/monitor on the BIG-IP partition.
# =============================================================================
---
apiVersion: cis.f5.com/v1
kind: VirtualServer
metadata:
  name: <app>-vs
  namespace: <app-ns>
spec:
  host: <app>.lab.ocp.local
  virtualServerAddress: "192.168.29.80"        # VIP assigned on BIG-IP
  # tlsProfileName / httpMrfRouter for TLS offload — see CIS docs
  pools:
    - path: /
      service: <app-svc>
      servicePort: 8080
      monitor:                                  # ★ align with readinessProbe
        type: http
        send: "GET /readyz HTTP/1.0"
        interval: 10
        timeout: 31
---
apiVersion: cis.f5.com/v1
kind: TransportServer
metadata:
  name: <db>-ts
  namespace: <app-ns>
spec:
  virtualServerAddress: "192.168.29.81"
  virtualServerPort: 5432
  mode: tcp
  pool:
    service: <db-svc>
    servicePort: 5432
  monitor:                                      # L4: TCP half-open or app-level
    type: tcp
    interval: 10
    timeout: 31
