# =============================================================================
# svc-infra HAProxy (192.168.29.10) — external LB for the UPI cluster
# Three jobs: (1) API LB for masters, (2) machine-config-server LB for Ignition,
# (3) app ingress LB -> router pods on workers.
#
# Health checks are aligned with the backend's real readiness semantics:
#   API     -> TCP 6443 (kube-apiserver /healthz via TCP check; add httpchk for
#              /readyz if you want request-level checking)
#   Apps    -> GET / on router :80 expects the router's own response (router
#              health lives on :1936 internally; port 80 responding = router up)
# =============================================================================

# ----------------------------- API load balancer -----------------------------
frontend openshift_api
    bind *:6443
    mode tcp
    option tcplog
    default_backend masters_api

backend masters_api
    mode tcp
    balance roundrobin
    option tcp-check
    # TCP connect = "apiserver process accepting"; upgrade to request-level:
    # option httpchk GET /readyz
    # server ... check-ssl verify none port 6443
    server master-1 192.168.29.21:6443 check
    server master-2 192.168.29.22:6443 check
    server master-3 192.168.29.23:6443 check

# ----------------- Machine Config Server (bootstrap/Ignition) ----------------
frontend machine_config
    bind *:22623
    mode tcp
    option tcplog
    default_backend masters_mcs

backend masters_mcs
    mode tcp
    balance roundrobin
    option tcp-check
    server master-1 192.168.29.21:22623 check
    server master-2 192.168.29.22:22623 check
    server master-3 192.168.29.23:22623 check

# --------------------------- App ingress (L4 pass) ---------------------------
# Apps terminate TLS at the router (edge) — HAProxy here is a dumb L4 pipe.
# Keep :443 in tcp mode so SNI-based routing inside the router still works.
frontend apps_http
    bind *:80
    mode tcp
    option tcplog
    default_backend workers_http

backend workers_http
    mode tcp
    balance roundrobin
    option tcp-check
    server worker-1 192.168.29.31:80 check
    server worker-2 192.168.29.32:80 check

frontend apps_https
    bind *:443
    mode tcp
    option tcplog
    default_backend workers_https

backend workers_https
    mode tcp
    balance roundrobin
    option tcp-check
    server worker-1 192.168.29.31:443 check
    server worker-2 192.168.29.32:443 check
