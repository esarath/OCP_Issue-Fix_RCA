# =============================================================================
# LDAP bind-password secret — TEMPLATE.
# Prefer the imperative command so the password never touches git:
#
#   oc create secret generic ldap-secret \
#     --from-literal=bindPassword='<service-account-password>' \
#     -n openshift-config
#
# This manifest exists only as a shape reference. Fill stringData at apply time
# or seal it (SealedSecrets/ESO) — do not commit a real password.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ldap-secret
  namespace: openshift-config
type: Opaque
stringData:
  bindPassword: "<service-account-password>"
