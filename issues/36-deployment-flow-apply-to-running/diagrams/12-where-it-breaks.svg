<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1040 310' width='1040' height='310' role='img' aria-label='Where it breaks: Pending with no node means scheduler failure; Pending with a node assigned means kubelet cannot pull image or reach the API' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Where it breaks: Pending with no node means scheduler failure; Pending with a node assigned means kubelet cannot pull image or reach the API</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='20' y='20' width='490' height='275' rx='8' fill='#F7F7FD' stroke='#C0392B' stroke-dasharray='6 4'/><text x='30' y='38' font-size='11.5' text-anchor='start' fill='#C0392B' font-weight='600' >Stuck Pending — NO node assigned</text><rect x='40' y='60' width='150' height='50' rx='10' fill='#EEEEEE' stroke='#888888' stroke-width='1.3'/><text x='115.0' y='82.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Pod</text><text x='115.0' y='98.0' text-anchor='middle' font-size='10.5' fill='#444'>nodeName: &quot;&quot;</text><rect x='250' y='60' width='150' height='50' rx='5' fill='#F8C8DC' stroke='#B03A73' stroke-width='1.3'/><text x='325.0' y='82.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Scheduler</text><text x='325.0' y='98.0' text-anchor='middle' font-size='10.5' fill='#444'>0 nodes fit</text><path d='M411,76 L429,94 M429,76 L411,94' stroke='#C0392B' stroke-width='2.4'/><path d='M190,85 L248,85' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><rect x='60' y='135' width='300' height='36' rx='5' fill='#FFD6D6' stroke='#C0392B' stroke-width='1.3'/><text x='210.0' y='157.5' text-anchor='middle' font-size='13'  fill='#111'>NotReady nodes</text><rect x='60' y='179' width='300' height='36' rx='5' fill='#FFD6D6' stroke='#C0392B' stroke-width='1.3'/><text x='210.0' y='201.5' text-anchor='middle' font-size='13'  fill='#111'>no CPU / memory capacity</text><rect x='60' y='223' width='300' height='36' rx='5' fill='#FFD6D6' stroke='#C0392B' stroke-width='1.3'/><text x='210.0' y='245.5' text-anchor='middle' font-size='13'  fill='#111'>taints not tolerated</text><text x='265' y='284' font-size='11' text-anchor='middle' fill='#444'  font-style='italic'>check: oc describe pod → Events: FailedScheduling</text><rect x='530' y='20' width='490' height='275' rx='8' fill='#F7F7FD' stroke='#C0392B' stroke-dasharray='6 4'/><text x='540' y='38' font-size='11.5' text-anchor='start' fill='#C0392B' font-weight='600' >Pending forever — node IS assigned</text><rect x='550' y='60' width='150' height='50' rx='10' fill='#EEEEEE' stroke='#888888' stroke-width='1.3'/><text x='625.0' y='82.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Pod</text><text x='625.0' y='98.0' text-anchor='middle' font-size='10.5' fill='#444'>nodeName: worker-2</text><rect x='760' y='60' width='150' height='50' rx='5' fill='#C7D7F5' stroke='#2F5FB3' stroke-width='1.3'/><text x='835.0' y='82.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Kubelet</text><text x='835.0' y='98.0' text-anchor='middle' font-size='10.5' fill='#444'>stuck</text><path d='M921,76 L939,94 M939,76 L921,94' stroke='#C0392B' stroke-width='2.4'/><path d='M700,85 L758,85' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><rect x='570' y='135' width='330' height='36' rx='5' fill='#FFD6D6' stroke='#C0392B' stroke-width='1.3'/><text x='735.0' y='157.5' text-anchor='middle' font-size='13'  fill='#111'>can&#x27;t pull image (ErrImagePull)</text><rect x='570' y='179' width='330' height='36' rx='5' fill='#FFD6D6' stroke='#C0392B' stroke-width='1.3'/><text x='735.0' y='201.5' text-anchor='middle' font-size='13'  fill='#111'>can&#x27;t reach API (expired kubelet certs)</text><rect x='570' y='223' width='330' height='36' rx='5' fill='#FFD6D6' stroke='#C0392B' stroke-width='1.3'/><text x='735.0' y='245.5' text-anchor='middle' font-size='13'  fill='#111'>volume / secret mount failure</text><text x='775' y='284' font-size='11' text-anchor='middle' fill='#444'  font-style='italic'>check: oc get csr · oc describe node · kubelet logs</text></svg>