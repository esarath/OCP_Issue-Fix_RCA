<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 250' width='1000' height='250' role='img' aria-label='Restaurant analogy: front desk is the API server, order book is etcd, kitchen manager is the controller, host is the scheduler, waiter is the kubelet' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Restaurant analogy: front desk is the API server, order book is etcd, kitchen manager is the controller, host is the scheduler, waiter is the kubelet</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><text x='16' y='62' font-size='12' text-anchor='start' fill='#555' font-weight='700' >Restaurant</text><text x='16' y='182' font-size='12' text-anchor='start' fill='#555' font-weight='700' >Kubernetes</text><rect x='105' y='36' width='132' height='50' rx='5' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='171.0' y='58.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>You</text><text x='171.0' y='74.0' text-anchor='middle' font-size='10.5' fill='#444'>place the order</text><rect x='105' y='156' width='132' height='50' rx='5' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='171.0' y='178.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>You (oc / kubectl)</text><text x='171.0' y='194.0' text-anchor='middle' font-size='10.5' fill='#444'>oc apply</text><path d='M171,88 L171,154' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><path d='M237,61 L251,61' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M237,181 L251,181' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><rect x='253' y='36' width='132' height='50' rx='5' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='319.0' y='58.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Front desk</text><text x='319.0' y='74.0' text-anchor='middle' font-size='10.5' fill='#444'>takes the order</text><rect x='253' y='156' width='132' height='50' rx='5' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='319.0' y='178.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>kube-apiserver</text><text x='319.0' y='194.0' text-anchor='middle' font-size='10.5' fill='#444'>validate + store</text><path d='M319,88 L319,154' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><path d='M385,61 L399,61' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M385,181 L399,181' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><rect x='401' y='36' width='132' height='50' rx='5' fill='#FFF4A3' stroke='#A89400' stroke-width='1.3'/><text x='467.0' y='58.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Order book</text><text x='467.0' y='74.0' text-anchor='middle' font-size='10.5' fill='#444'>order written down</text><rect x='401' y='156' width='132' height='50' rx='5' fill='#FFF4A3' stroke='#A89400' stroke-width='1.3'/><text x='467.0' y='178.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>etcd</text><text x='467.0' y='194.0' text-anchor='middle' font-size='10.5' fill='#444'>desired state</text><path d='M467,88 L467,154' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><path d='M533,61 L547,61' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M533,181 L547,181' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><rect x='549' y='36' width='132' height='50' rx='5' fill='#FFD3A1' stroke='#C2711B' stroke-width='1.3'/><text x='615.0' y='58.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Kitchen manager</text><text x='615.0' y='74.0' text-anchor='middle' font-size='10.5' fill='#444'>splits into tasks</text><rect x='549' y='156' width='132' height='50' rx='5' fill='#FFD3A1' stroke='#C2711B' stroke-width='1.3'/><text x='615.0' y='178.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Controllers</text><text x='615.0' y='194.0' text-anchor='middle' font-size='10.5' fill='#444'>Deployment → RS → Pods</text><path d='M615,88 L615,154' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><path d='M681,61 L695,61' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M681,181 L695,181' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><rect x='697' y='36' width='132' height='50' rx='5' fill='#F8C8DC' stroke='#B03A73' stroke-width='1.3'/><text x='763.0' y='58.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Host</text><text x='763.0' y='74.0' text-anchor='middle' font-size='10.5' fill='#444'>assigns a table</text><rect x='697' y='156' width='132' height='50' rx='5' fill='#F8C8DC' stroke='#B03A73' stroke-width='1.3'/><text x='763.0' y='178.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Scheduler</text><text x='763.0' y='194.0' text-anchor='middle' font-size='10.5' fill='#444'>pod → node</text><path d='M763,88 L763,154' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><path d='M829,61 L843,61' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M829,181 L843,181' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><rect x='845' y='36' width='132' height='50' rx='5' fill='#C7D7F5' stroke='#2F5FB3' stroke-width='1.3'/><text x='911.0' y='58.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Waiter</text><text x='911.0' y='74.0' text-anchor='middle' font-size='10.5' fill='#444'>actually serves it</text><rect x='845' y='156' width='132' height='50' rx='5' fill='#C7D7F5' stroke='#2F5FB3' stroke-width='1.3'/><text x='911.0' y='178.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Kubelet + CRI-O</text><text x='911.0' y='194.0' text-anchor='middle' font-size='10.5' fill='#444'>runs containers</text><path d='M911,88 L911,154' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><text x='500' y='236' font-size='11.5' text-anchor='middle' fill='#444'  font-style='italic'>Same chain of hand-offs: each role only does its own job and passes the work on.</text></svg>