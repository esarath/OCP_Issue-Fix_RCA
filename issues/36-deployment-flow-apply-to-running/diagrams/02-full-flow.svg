<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1040 470' width='1040' height='470' role='img' aria-label='Full deploy flow: everything talks only to the API server, which stores state in etcd; controllers, scheduler and kubelet watch it' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Full deploy flow: everything talks only to the API server, which stores state in etcd; controllers, scheduler and kubelet watch it</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='20' y='200' width='140' height='56' rx='5' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='90.0' y='225.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>You</text><text x='90.0' y='241.0' text-anchor='middle' font-size='10.5' fill='#444'>oc apply -f deployment.yaml</text><rect x='330' y='196' width='170' height='64' rx='5' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='415.0' y='225.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>kube-apiserver</text><text x='415.0' y='241.0' text-anchor='middle' font-size='10.5' fill='#444'>the only front door</text><rect x='345' y='370' width='140' height='54' rx='5' fill='#FFF4A3' stroke='#A89400' stroke-width='1.3'/><text x='415.0' y='394.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>etcd</text><text x='415.0' y='410.0' text-anchor='middle' font-size='10.5' fill='#444'>cluster database</text><rect x='640' y='30' width='180' height='50' rx='5' fill='#FFD3A1' stroke='#C2711B' stroke-width='1.3'/><text x='730.0' y='52.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Deployment controller</text><text x='730.0' y='68.0' text-anchor='middle' font-size='10.5' fill='#444'>creates ReplicaSet</text><rect x='640' y='110' width='180' height='50' rx='5' fill='#FFD3A1' stroke='#C2711B' stroke-width='1.3'/><text x='730.0' y='132.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>ReplicaSet controller</text><text x='730.0' y='148.0' text-anchor='middle' font-size='10.5' fill='#444'>creates 3 Pods</text><rect x='640' y='190' width='180' height='50' rx='5' fill='#F8C8DC' stroke='#B03A73' stroke-width='1.3'/><text x='730.0' y='212.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Scheduler</text><text x='730.0' y='228.0' text-anchor='middle' font-size='10.5' fill='#444'>binds pod → node</text><rect x='610' y='270' width='410' height='180' rx='8' fill='#F7F7FD' stroke='#4B4BA0' stroke-dasharray='6 4'/><text x='620' y='288' font-size='11.5' text-anchor='start' fill='#4B4BA0' font-weight='600' >Node: worker-2</text><rect x='630' y='300' width='120' height='46' rx='5' fill='#C7D7F5' stroke='#2F5FB3' stroke-width='1.3'/><text x='690.0' y='320.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Kubelet</text><text x='690.0' y='336.0' text-anchor='middle' font-size='10.5' fill='#444'>node agent</text><rect x='780' y='300' width='100' height='46' rx='5' fill='#D9C7F0' stroke='#6A3FA0' stroke-width='1.3'/><text x='830.0' y='320.0' text-anchor='middle' font-size='13'  fill='#111'>CRI-O</text><text x='830.0' y='336.0' text-anchor='middle' font-size='10.5' fill='#444'>pull + run</text><rect x='900' y='300' width='100' height='46' rx='5' fill='#B8E6D9' stroke='#2A8C6E' stroke-width='1.3'/><text x='950.0' y='320.0' text-anchor='middle' font-size='13'  fill='#111'>CNI</text><text x='950.0' y='336.0' text-anchor='middle' font-size='10.5' fill='#444'>OVN-K: pod IP</text><rect x='700' y='375' width='212' height='50' fill='none' stroke='#555' stroke-dasharray='3 3'/><rect x='708' y='383' width='60' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='738.0' y='404.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><rect x='776' y='383' width='60' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='806.0' y='404.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><rect x='844' y='383' width='60' height='34' rx='10' fill='#A9E1EE' stroke='#2C7A8A' stroke-width='1.3'/><text x='874.0' y='404.5' text-anchor='middle' font-size='13'  fill='#111'>Pod</text><path d='M160,228 L328,228' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><text x='244.0' y='221' font-size='11' text-anchor='middle' fill='#555'  font-style='italic'>YAML</text><circle cx='244' cy='248' r='9' fill='#4B4BA0'/><text x='244' y='252' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>1</text><path d='M400,262 L400,368' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M430,368 L430,262' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><text x='330' y='320' font-size='11' text-anchor='end' fill='#555'  font-style='italic'>write</text><text x='438' y='320' font-size='11' text-anchor='start' fill='#555'  font-style='italic'>watch</text><circle cx='370' cy='345' r='9' fill='#4B4BA0'/><text x='370' y='349' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>2</text><path d='M638,55 L520,55 L520,226 L502,226' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><circle cx='620' cy='43' r='9' fill='#4B4BA0'/><text x='620' y='47' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>3</text><path d='M638,135 L520,135 L520,226 L502,226' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><circle cx='620' cy='123' r='9' fill='#4B4BA0'/><text x='620' y='127' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>4</text><path d='M638,215 L520,215 L520,226 L502,226' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><circle cx='620' cy='203' r='9' fill='#4B4BA0'/><text x='620' y='207' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>5</text><path d='M628,323 L540,323 L540,236 L502,236' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/><circle cx='600' cy='312' r='9' fill='#4B4BA0'/><text x='600' y='316' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>6</text><text x='512' y='100' font-size='11' text-anchor='end' fill='#555'  font-style='italic'>watch / update</text><path d='M750,323 L778,323' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M880,323 L898,323' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M690,346 L690,373' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><circle cx='955' cy='400' r='9' fill='#4B4BA0'/><text x='955' y='404' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>7</text><text x='860' y='438' font-size='11' text-anchor='middle' fill='#444'  >probes pass → Endpoints → traffic</text><circle cx='30' cy='40' r='9' fill='#4B4BA0'/><text x='30' y='44' text-anchor='middle' font-size='11' font-weight='700' fill='#fff'>8</text><text x='46' y='44' font-size='11' text-anchor='start' fill='#4B4BA0' font-weight='600' >Step 8: every controller loops forever — desired vs actual</text></svg>