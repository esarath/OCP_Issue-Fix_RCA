<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1040 300' width='1040' height='300' role='img' aria-label='Step 7: CNI gives the pod an IP, probes run, readiness adds the pod to EndpointSlice, Service sends traffic, kubelet reports Running' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Step 7: CNI gives the pod an IP, probes run, readiness adds the pod to EndpointSlice, Service sends traffic, kubelet reports Running</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='20' y='60' width='140' height='56' rx='5' fill='#B8E6D9' stroke='#2A8C6E' stroke-width='1.3'/><text x='90.0' y='85.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>CNI (OVN-K)</text><text x='90.0' y='101.0' text-anchor='middle' font-size='10.5' fill='#444'>pod IP 10.128.2.15</text><rect x='200' y='60' width='170' height='56' rx='5' fill='#C7D7F5' stroke='#2F5FB3' stroke-width='1.3'/><text x='285.0' y='85.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Probes</text><text x='285.0' y='101.0' text-anchor='middle' font-size='10.5' fill='#444'>startup · readiness · liveness</text><rect x='410' y='60' width='110' height='56' rx='5' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='465.0' y='85.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Ready ✓</text><text x='465.0' y='101.0' text-anchor='middle' font-size='10.5' fill='#444'>readiness passed</text><rect x='560' y='60' width='170' height='56' rx='5' fill='#FFD3A1' stroke='#C2711B' stroke-width='1.3'/><text x='645.0' y='85.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>EndpointSlice</text><text x='645.0' y='101.0' text-anchor='middle' font-size='10.5' fill='#444'>+ 10.128.2.15:8080</text><rect x='770' y='66' width='100' height='44' rx='5' fill='#FFFFFF' stroke='#333333' stroke-width='1.3'/><text x='820.0' y='85.0' text-anchor='middle' font-size='13'  fill='#111'>Service</text><text x='820.0' y='101.0' text-anchor='middle' font-size='10.5' fill='#444'>myapp</text><rect x='910' y='63' width='110' height='50' rx='5' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='965.0' y='85.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Traffic</text><text x='965.0' y='101.0' text-anchor='middle' font-size='10.5' fill='#444'>reaches pod</text><path d='M160,88 L198,88' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M370,88 L408,88' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M520,88 L558,88' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M730,88 L768,88' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><path d='M870,88 L908,88' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><rect x='200' y='190' width='170' height='56' rx='5' fill='#C7D7F5' stroke='#2F5FB3' stroke-width='1.3'/><text x='285.0' y='215.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>Kubelet</text><text x='285.0' y='231.0' text-anchor='middle' font-size='10.5' fill='#444'>reports pod status</text><rect x='450' y='190' width='170' height='56' rx='5' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='535.0' y='215.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>kube-apiserver</text><text x='535.0' y='231.0' text-anchor='middle' font-size='10.5' fill='#444'>status: Running</text><rect x='700' y='190' width='230' height='56' rx='5' fill='#EFEFEF' stroke='#777777' stroke-width='1.3'/><text x='815.0' y='215.0' text-anchor='middle' 