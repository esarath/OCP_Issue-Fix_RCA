<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 170' width='880' height='170' role='img' aria-label='Step 1: oc apply sends the Deployment YAML to the API server' font-family='Segoe UI, Helvetica, Arial, sans-serif'><title>Step 1: oc apply sends the Deployment YAML to the API server</title><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#222'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerUnits='userSpaceOnUse' markerWidth='10' markerHeight='10' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker></defs><rect width='100%' height='100%' fill='#FFFFFF'/><rect x='20' y='55' width='150' height='56' rx='5' fill='#C9E7A7' stroke='#4F7F2A' stroke-width='1.3'/><text x='95.0' y='80.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>You</text><text x='95.0' y='96.0' text-anchor='middle' font-size='10.5' fill='#444'>terminal</text><rect x='240' y='50' width='210' height='66' rx='5' fill='#EFEFEF' stroke='#777777' stroke-width='1.3'/><text x='345.0' y='80.0' text-anchor='middle' font-size='13'  fill='#111'>deployment.yaml</text><text x='345.0' y='96.0' text-anchor='middle' font-size='10.5' fill='#444'>kind: Deployment · replicas: 3</text><rect x='530' y='50' width='190' height='66' rx='5' fill='#BDBDEB' stroke='#4B4BA0' stroke-width='1.3'/><text x='625.0' y='80.0' text-anchor='middle' font-size='13' font-weight='600' fill='#111'>kube-apiserver</text><text x='625.0' y='96.0' text-anchor='middle' font-size='10.5' fill='#444'>HTTPS :6443</text><path d='M170,83 L238,83' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><text x='204.0' y='76' font-size='11' text-anchor='middle' fill='#555'  font-style='italic'>oc apply -f</text><path d='M450,83 L528,83' fill='none' stroke='#222' stroke-width='1.3'  marker-end='url(#ah)'/><text x='489.0' y='76' font-size='11' text-anchor='middle' fill='#555'  font-style='italic'>REST POST</text><text x='625' y='145' font-size='11.5' text-anchor='middle' fill='#4B4BA0' font-weight='600' >the only component you ever talk to</text><text x='130' y='145' font-size='11.5' text-anchor='middle' fill='#555'  font-style='italic'>or: oc create deployment · helm install</text><rect x='760' y='60' width='100' height='46' rx='10' fill='#EEEEEE' stroke='#888888' stroke-width='1.3'/><text x='810.0' y='80.0' text-anchor='middle' font-size='13'  fill='#111'>everything else</text><text x='810.0' y='96.0' text-anchor='middle' font-size='10.5' fill='#444'>reacts to it</text><path d='M720,83 L758,83' fill='none' stroke='#222' stroke-width='1.3' stroke-dasharray='5 4' marker-end='url(#ah)'/></svg>