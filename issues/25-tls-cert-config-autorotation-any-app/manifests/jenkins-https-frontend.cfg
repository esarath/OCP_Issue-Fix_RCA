# =============================================================================
# Jenkins HTTPS Frontend — svc-infra HAProxy (192.168.29.10)
# Terminates TLS at HAProxy, forwards HTTP to the OpenShift router/service.
#
# Build the PEM first (cert + key in one file):
#   cat jenkins.crt jenkins.key > /etc/haproxy/certs/jenkins.pem
#   chmod 600 /etc/haproxy/certs/jenkins.pem
# Reload after changes:  systemctl reload haproxy
# =============================================================================
frontend jenkins_frontend
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/jenkins.pem
    mode http
    option httplog
    redirect scheme https code 301 if !{ ssl_fc }
    acl jenkins_host hdr(host) -i jenkins-jenkins.apps.lab.ocp.local
    use_backend jenkins_backend if jenkins_host

# =============================================================================
# Jenkins Backend — plain HTTP to the cluster ingress
# =============================================================================
backend jenkins_backend
    mode http
    balance roundrobin
    option httpchk GET /jenkins/login
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    server jenkins_svc 192.168.29.10:8080 check
