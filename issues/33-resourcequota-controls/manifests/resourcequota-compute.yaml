apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-quota
  namespace: <target-namespace>
  labels:
    governance: quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "5"
    requests.storage: 50Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
    configmaps: "50"
    secrets: "50"
